<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>きゅるしてコールまとめ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    /* ================================
       基本
    ================================= */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        "M PLUS Rounded 1c",
        "Arial Rounded MT Bold",
        "Hiragino Maru Gothic ProN",
        "Yu Gothic",
        sans-serif;
      color: #4b3946;
      background: #fff8fc;
      line-height: 1.8;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* ================================
       ヘッダー
    ================================= */
    .site-header {
      background-image:
        linear-gradient(
          rgba(255, 220, 235, 0.25),
          rgba(245, 220, 255, 0.25)
        ),
        url("images/header-bg.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      padding: 45px 20px 50px;
      text-align: center;
      border-bottom: 1px solid #efc4da;
    }

    .logo {
      margin: 0;
      font-size: 30px;
      color: white;
      text-shadow:
        -2px -2px 0 #c64e88,
         2px -2px 0 #c64e88,
        -2px  2px 0 #c64e88,
         2px  2px 0 #c64e88,
         0 3px 8px rgba(120, 70, 100, 0.25);
    }

    .subtitle {
      color: white;
      font-size: 12px;
      letter-spacing: 2px;
      margin: 4px 0 14px;
      text-shadow:
        -1px -1px 0 #a75b80,
         1px -1px 0 #a75b80,
        -1px  1px 0 #a75b80,
         1px  1px 0 #a75b80;
    }

    .intro {
      max-width: 680px;
      margin: 0 auto;
      font-size: 14px;
      color: white;
      text-shadow:
        -1px -1px 0 #a75b80,
         1px -1px 0 #a75b80,
        -1px  1px 0 #a75b80,
         1px  1px 0 #a75b80;
    }

    .nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .nav button,
    .back-button {
      border: 1px solid #e9a8c9;
      background: white;
      color: #bd4b83;
      border-radius: 999px;
      padding: 8px 18px;
      font-weight: bold;
    }

    /* ================================
       全体
    ================================= */
    .container {
      max-width: 1050px;
      margin: 0 auto;
      padding: 30px 16px 60px;
    }

    /* ================================
       検索
    ================================= */
    .search-box {
      display: block;
      width: 100%;
      padding: 13px 16px;
      border: 1px solid #efc3da;
      border-radius: 12px;
      background: white;
      outline-color: #d66b9e;
      margin-bottom: 20px;
    }

    /* ================================
       曲一覧
    ================================= */
    .song-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .song-card {
      background: white;
      border: 1px solid #f0d4e2;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(180, 90, 140, 0.07);
      display: flex;
      flex-direction: column;
      min-height: 430px;
    }

    .song-card h3 {
      margin: 0 0 12px;
      color: #bd4b83;
      font-size: 20px;
      text-align: center;
    }

    /* ================================
       サムネイル
    ================================= */
    .song-image {
      width: 100%;
      aspect-ratio: 16 / 9;
      margin: 0 0 18px;
      border-radius: 14px;
      overflow: hidden;
      background: #f8edf4;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .song-image img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* ================================
       曲を見るボタン
    ================================= */
    .detail-button {
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      background: #d8669c;
      color: white;
      font-weight: bold;
      margin-top: auto;
    }

    .detail-button:hover {
      background: #bd4b83;
    }

    /* ================================
       曲別ページ
    ================================= */
    .back-button {
      margin-bottom: 20px;
    }

    .detail-heading {
      background: linear-gradient(135deg, #ffe1ee, #f3e4ff);
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 22px;
      text-align: center;
    }

    .detail-heading h2 {
      color: #bd4b83;
      margin: 0;
      font-size: 28px;
    }

    /* ================================
       セクション
    ================================= */
    .section {
      background: white;
      border: 1px solid #f1d4e3;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .section h3 {
      margin-top: 0;
      color: #bd4b83;
      font-size: 20px;
      border-bottom: 2px solid #f8d9e8;
      padding-bottom: 8px;
    }

    /* ================================
       歌詞・コール
    ================================= */
    .lyrics-call-table {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .table-header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 8px;
    }

    .lyrics-th {
      background: #f8e6f0;
      color: #bd4b83;
      padding: 10px;
      border-radius: 8px;
    }

    .call-th {
      background: #f3e8fb;
      color: #9555a8;
      padding: 10px;
      border-radius: 8px;
    }

    .table-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      border-bottom: 1px dashed #f0d4e2;
      padding-bottom: 10px;
    }

    .lyrics-td, .call-td {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.8;
    }

    .lyrics-td { color: #4b3946; }
    .call-td { color: #b13e76; font-weight: 700; }

    /* ================================
       YouTube
    ================================= */
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      overflow: hidden;
      border-radius: 12px;
      background: #f8e9f1;
    }

    .video-wrapper iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: #92788a;
      padding: 30px;
      background: white;
      border-radius: 14px;
    }

    .site-footer {
      text-align: center;
      background: #f8e3ef;
      color: #977287;
      padding: 25px 15px;
      font-size: 12px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 650px) {
      .logo { font-size: 23px; }
      .song-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .song-card { min-height: 350px; padding: 12px; border-radius: 15px; }
      .song-card h3 { font-size: 15px; }
      .song-image { border-radius: 10px; margin-bottom: 12px; }
      .detail-button { font-size: 11px; padding: 8px 5px; }
      .detail-heading h2 { font-size: 23px; }
      .section { padding: 12px; }
      .container { padding-top: 20px; }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <h1 class="logo">きゅるしてコールまとめ♡311</h1>
    <div class="subtitle">KYURURIN TE SHITEMITE</div>
    <p class="intro">
      きゅるしてのコールを知りたい！<br>
      けど正しい情報がわからない人必見！！<br>
      主が現場参戦する度に更新し、
      流動的に変わるコールの最新情報をお届け！
    </p>
    <nav class="nav">
      <button onclick="showHome()">🏠 ホーム</button>
    </nav>
  </header>

  <main class="container">
    <!-- ホーム -->
    <section id="home-page">
      <input
        id="search"
        class="search-box"
        type="search"
        placeholder="🔍 曲名を検索…"
        oninput="searchSongs()"
      >
      <div id="song-list" class="song-grid"></div>
    </section>

    <!-- 曲別ページ -->
    <section id="detail-page" class="hidden">
      <button class="back-button" onclick="showHome()">← 曲一覧に戻る</button>
      <div id="song-detail"></div>
    </section>
  </main>

  <footer class="site-footer">
    きゅるしてコールまとめ<br>
    Fan-made reference site
  </footer>

  <script>
    /* ========================================
       曲データ
    ======================================== */
    const songs = [
      {
        id: 1,
        title: "推忍♡きゅるちゃん道場！",
        image: "images/doujou.jpg",
        youtubeUrl: "https://www.youtube.com/watch?v=GaJ270U7d2o", 
        startTime: 493,
        lyricsCalls: [
          { lyrics: "推忍♡きゅるちゃん道場始まるよ〜！", call: "" },
          { lyrics: "", call: "推忍！" },
          { lyrics: "ねえ〜もっとかわいくなりたい！", call: "う！はー！う！はー！" },
          { lyrics: "準備はいいですか？", call: "推忍！" }
        ]
      },
      {
        id: 2,
        title: "アイドルライブコースター！",
        image: "images/idollivecoaster.jpg",
        youtubeUrl: "https://www.youtube.com/watch?v=GaJ270U7d2o", 
        startTime: 1441,
        lyricsCalls: [
          { lyrics: "楽しむ準備いいですか？", call: "イェイ！" },
          { lyrics: "れでい？れでい？れっつごー！", call: "ハイ！ハイ！きゅるちゃん！" }
        ]
      },
      {
        id: 3,
        title: "らぶきゅん♡うぉんてっど",
        image: "images/lovekyun.jpg",
        youtubeUrl: "https://www.youtube.com/watch?v=GaJ270U7d2o",
        startTime: 1000,
        lyricsCalls: [
          { lyrics: "Are You Ready?", call: "" },
          { lyrics: "キミを一番好きなのはわたしだもん！", call: "タイガー！ファイヤー！サイバー！" }
        ]
      }
    ];

    /* ========================================
       描画・制御ロジック
    ======================================== */

    // YouTube URLから埋め込み用URLを生成
    function formatYoutubeUrl(url, startTime = 0) {
      if (!url) return "";
      let videoId = "";
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      if (match && match[2].length === 11) {
        videoId = match[2];
      }
      return `https://www.youtube.com/embed/${videoId}?start=${startTime}`;
    }

    // ホーム画面の曲カード一覧表示
    function renderSongs(songArray) {
      const listContainer = document.getElementById("song-list");
      if (songArray.length === 0) {
        listContainer.innerHTML = `<div class="empty">該当する曲が見つかりません。</div>`;
        return;
      }

      listContainer.innerHTML = songArray.map(song => `
        <article class="song-card">
          <h3>${song.title}</h3>
          <div class="song-image">
            <img src="${song.image}" alt="${song.title}" onerror="this.src='https://via.placeholder.com/300x169?text=No+Image'">
          </div>
          <button class="detail-button" onclick="showDetail(${song.id})">
            コールを見る
          </button>
        </article>
      `).join('');
    }

    // 検索処理
    function searchSongs() {
      const keyword = document.getElementById("search").value.toLowerCase().trim();
      const filtered = songs.filter(song => song.title.toLowerCase().includes(keyword));
      renderSongs(filtered);
    }

    // 詳細画面を表示
    function showDetail(id) {
      const song = songs.find(s => s.id === id);
      if (!song) return;

      const detailContainer = document.getElementById("song-detail");
      const embedUrl = formatYoutubeUrl(song.youtubeUrl, song.startTime);

      const rowsHtml = song.lyricsCalls.map(item => `
        <div class="table-row">
          <div class="lyrics-td">${item.lyrics || ''}</div>
          <div class="call-td">${item.call || ''}</div>
        </div>
      `).join('');

      detailContainer.innerHTML = `
        <div class="detail-heading">
          <h2>${song.title}</h2>
        </div>

        <section class="section">
          <h3>📹 参考動画</h3>
          <div class="video-wrapper">
            <iframe src="${embedUrl}" allowfullscreen></iframe>
          </div>
        </section>

        <section class="section">
          <h3>🎤 歌詞・コール</h3>
          <div class="lyrics-call-table">
            <div class="table-header">
              <div class="lyrics-th">歌詞</div>
              <div class="call-th">コール</div>
            </div>
            ${rowsHtml}
          </div>
        </section>
      `;

      document.getElementById("home-page").classList.add("hidden");
      document.getElementById("detail-page").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ホーム画面に戻る
    function showHome() {
      document.getElementById("home-page").classList.remove("hidden");
      document.getElementById("detail-page").classList.add("hidden");
    }

    // 初回読み込み時のレンダリング
    document.addEventListener("DOMContentLoaded", () => {
      renderSongs(songs);
    });
  </script>
</body>
</html>
