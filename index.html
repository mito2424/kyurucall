          <button class="detail-button" onclick="showDetail(${song.id})">曲を見る</button>
        </div>
      `).join("");
    }

    function searchSongs() {
      const query = document.getElementById("search").value.toLowerCase();
      const filtered = songs.filter(song => song.title.toLowerCase().includes(query));
      renderSongs(filtered);
    }

    function showHome() {
      document.getElementById("home-page").classList.remove("hidden");
      document.getElementById("detail-page").classList.add("hidden");
      renderSongs(songs);
    }

    function getYoutubeId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : url;
    }

    function showDetail(id) {
      const song = songs.find(s => s.id === id);
      if (!song) return;

      const ytId = getYoutubeId(song.youtubeId);
      const embedUrl = `https://www.youtube.com/embed/${ytId}?start=${song.startTime || 0}`;

      const rows = song.lyricsCalls.map(item => `
        <div class="table-row">
          <div class="lyrics-td">${item.lyrics}</div>
          <div class="call-td">${item.call}</div>
        </div>
      `).join("");

      document.getElementById("song-detail").innerHTML = `
        <div class="detail-heading">
          <h2>${song.title}</h2>
        </div>
        <div class="section">
          <h3>歌詞・コール</h3>
          <div class="lyrics-call-table">
            <div class="table-header">
              <div class="lyrics-th">歌詞</div>
              <div class="call-th">コール</div>
            </div>
            ${rows}
          </div>
        </div>
        <div class="section">
          <h3>参考動画</h3>
          <div class="video-wrapper">
            <iframe src="${embedUrl}" allowfullscreen></iframe>
          </div>
        </div>
      `;

      document.getElementById("home-page").classList.add("hidden");
      document.getElementById("detail-page").classList.remove("hidden");
      window.scrollTo(0, 0);
    }

    
    /* ========================================== YouTube ID抽出関数 ========================================== */
    function extractYouTubeId(urlOrId) {
      if (!urlOrId) return "";
      const match = urlOrId.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      return match ? match[1] : urlOrId.trim();
    }

    /* ========================================== HTML安全表示 ========================================== */
    function escapeHTML(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    /* ========================================== 曲一覧表示 ========================================== */
    function renderSongs(list = songs) {
      const songList = document.getElementById("song-list");
      songList.innerHTML = "";
      if (list.length === 0) {
        songList.innerHTML = `<div class="empty">該当する曲が見つかりませんでした。</div>`;
        return;
      }
      list.forEach(song => {
        const card = document.createElement("article");
        card.className = "song-card";
        card.onclick = () => showDetail(song.id);
        card.innerHTML = `
          <h3>${escapeHTML(song.title)}</h3>
          <div class="song-update">${escapeHTML(song.updateDate || "3/31更新")}</div>
          <div class="song-image">
            <img src="${escapeHTML(song.image)}" alt="${escapeHTML(song.title)}" onerror="this.style.display='none'">
          </div>
          <button class="detail-button">曲を見る</button>
        `;
        songList.appendChild(card);
      });
    }

    /* ========================================== 検索機能 ========================================== */
    function searchSongs() {
      const query = document.getElementById("search").value.toLowerCase().trim();
      const filtered = songs.filter(song => song.title.toLowerCase().includes(query));
      renderSongs(filtered);
    }

    /* ========================================== ホーム画面表示 ========================================== */
    function showHome() {
      document.getElementById("home-page").classList.remove("hidden");
      document.getElementById("detail-page").classList.add("hidden");
      renderSongs(songs);
    }

    /* ========================================== 詳細画面表示 ========================================== */
    function showDetail(id) {
      const song = songs.find(s => s.id === id);
      if (!song) return;

      const ytId = extractYouTubeId(song.youtubeId);
      const videoHTML = ytId 
        ? `<iframe src="https://www.youtube.com/embed/${ytId}?start=${song.startTime || 0}" allowfullscreen></iframe>`
        : `<p>まだ参考動画が設定されていません。</p>`;

      let rowsHTML = "";
      if (song.lyricsCalls && song.lyricsCalls.length > 0) {
        rowsHTML = song.lyricsCalls.map(block => `
          <div class="table-row">
            <div class="lyrics-td">${escapeHTML(block.lyrics || "")}</div>
            <div class="call-td">${escapeHTML(block.call || "")}</div>
          </div>
        `).join("");
      }

      document.getElementById("song-detail").innerHTML = `
        <div class="detail-heading">
          <h2>${escapeHTML(song.title)}</h2>
        </div>
        <div class="section">
          <h3>歌詞・コール</h3>
          <div class="lyrics-call-table">
            <div class="table-header">
              <div class="lyrics-th">歌詞</div>
              <div class="call-th">コール・掛け声</div>
            </div>
            ${rowsHTML}
          </div>
        </div>
        <div class="section">
          <h3>参考動画</h3>
          <div class="video-wrapper">
            ${videoHTML}
          </div>
        </div>
      `;

      document.getElementById("home-page").classList.add("hidden");
      document.getElementById("detail-page").classList.remove("hidden");
      window.scrollTo(0, 0);
    }

    /* ========================================== 初期表示 ========================================== */
    renderSongs();
  </script>
</body>
</html>
</html>
