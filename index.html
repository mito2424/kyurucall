      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      padding: 45px 20px 50px;

      text-align: center;

      border-bottom: 1px solid #efc4da;
    }


    .logo {
      margin: 0;

      font-size: 30px;

      color: white;

      text-shadow:
        -2px -2px 0 #c64e88,

         2px  2px 0 #c64e88,

    }


    .subtitle {
      color: white;

      font-size: 12px;

      letter-spacing: 2px;

      margin: 4px 0 14px;

      text-shadow:
        -1px -1px 0 #a75b80,
         1px -1px 0 #a75b80,
        -1px  1px 0 #a75b80,
         1px  1px 0 #a75b80;
    }


    .intro {
      max-width: 680px;

      margin: 0 auto;

      font-size: 14px;

      color: white;

      text-shadow:
        -1px -1px 0 #a75b80,
         1px -1px 0 #a75b80,
        -1px  1px 0 #a75b80,
         1px  1px 0 #a75b80;
    }


    .nav {
      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 10px;

      margin-top: 20px;
    }


    .nav button,
    .back-button {
      border: 1px solid #e9a8c9;

      background: white;

      color: #bd4b83;

      border-radius: 999px;

      padding: 8px 18px;

      font-weight: bold;
    }

       全体
    ================================= */

    .container {
      max-width: 1050px;

      margin: 0 auto;

      padding: 30px 16px 60px;
    }

       検索
    ================================= */

    .search-box {
      display: block;

      width: 100%;

      padding: 13px 16px;

      border: 1px solid #efc3da;

      border-radius: 12px;

      background: white;

      outline-color: #d66b9e;

      margin-bottom: 20px;
    }


    /* ================================
       曲一覧
    ================================= */

    .song-grid {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 18px;
    }


    .song-card {
      background: white;

      border: 1px solid #f0d4e2;

      border-radius: 20px;

      padding: 20px;

      box-shadow:
        0 5px 20px rgba(180, 90, 140, 0.07);

      display: flex;

      flex-direction: column;

      min-height: 430px;
    }


    .song-card h3 {
      margin: 0 0 12px;

      color: #bd4b83;

      font-size: 20px;

      text-align: center;
    }


    /* ================================
       サムネイル
    ================================= */

    .song-image {
      width: 100%;

      aspect-ratio: 16 / 9;

      margin: 0 0 18px;

      border-radius: 14px;

      overflow: hidden;

      background: #f8edf4;

      display: flex;

      align-items: center;

      justify-content: center;
    }


    .song-image img {
      width: 100%;

      height: 100%;

      display: block;

      object-fit: contain;
    }


    /* ================================
       曲を見るボタン
    ================================= */

    .detail-button {
      border: none;

      border-radius: 999px;

      padding: 10px 16px;

      background: #d8669c;

      color: white;

      font-weight: bold;

      margin-top: auto;
    }


    .detail-button:hover {
      background: #bd4b83;
    }

       曲別ページ
    ================================= */

    .back-button {
      margin-bottom: 20px;
    }


    .detail-heading {
      background:
        linear-gradient(
          135deg,
          #ffe1ee,
          #f3e4ff
        );

      border-radius: 18px;

      padding: 25px;

      margin-bottom: 22px;

      text-align: center;
    }


    .detail-heading h2 {
      color: #bd4b83;

      margin: 0;

      font-size: 28px;
    }


    /* ================================
       セクション
    ================================= */

    .section {
      background: white;

      border: 1px solid #f1d4e3;

      border-radius: 16px;

      padding: 20px;

      margin-bottom: 20px;
    }


    .section h3 {
      margin-top: 0;

      color: #bd4b83;

      font-size: 20px;

      border-bottom:
        2px solid #f8d9e8;

      padding-bottom: 8px;
    }

       歌詞・コール（ブロック表示）
    ================================= */

    .lyrics-call-table {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .table-header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 8px;
    }

    .lyrics-th {
      background: #f8e6f0;
      color: #bd4b83;
      padding: 10px;
      border-radius: 8px;
    }

    .call-th {
      background: #f3e8fb;
      color: #9555a8;
      padding: 10px;
      border-radius: 8px;
    }

    .table-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      border-bottom: 1px dashed #f0d4e2;
      padding-bottom: 10px;
    }

    .lyrics-td, .call-td {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.8;

    .call-td { color: #b13e76; font-weight: 700; }

       YouTube
    ================================= */

      position: relative;

      width: 100%;

      padding-top: 56.25%;

      overflow: hidden;

      border-radius: 12px;

      background: #f8e9f1;
    }

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      border: 0;
    }

      font-size: 12px;

      color: #947687;

      background: #fff8fc;

      padding: 12px;

      border-radius: 8px;

      margin-top: 12px;

    ================================= */

      background: white;

      border-radius: 14px;

       フッター
    ================================= */

    ================================= */

### 主な原因

1. **JavaScriptコードの中断（文法エラー）**
   3曲目（`らぶきゅん♡うぉんてっど`）の途中で記述が切れており、配列やオブジェクトを閉じる記号（`}` や `]`）、および `<script>` タグが閉じていませんでした。これによりスクリプト全体のエラーとなり、描画処理が動作していませんでした。
2. **描画・検索・画面切り替え用のJavaScript関数が未定義**
   HTML側で呼び出している `showHome()` や `searchSongs()`、カードや詳細画面を生成する処理が実装されていませんでした。
3. **YouTube動画の埋め込み処理**
   `https://www.youtube.com/watch?v=...` 形式のURLをそのまま `iframe` に入れると再生エラーになるため、埋め込み用URL（`https://www.youtube.com/embed/...`）に自動変換する処理を追加しました。

    function getEmbedUrl(urlStr, start) {
      if (!urlStr) return "";
      let videoId = "";
      if (urlStr.includes("v=")) {
        videoId = urlStr.split("v=")[1].split("&")[0];
      } else if (urlStr.includes("youtu.be/")) {
        videoId = urlStr.split("youtu.be/")[1].split("?")[0];
      } else {
        videoId = urlStr;
      }
      return `[https://www.youtube.com/embed/$](https://www.youtube.com/embed/$){videoId}${start ? '?start=' + start : ''}`;

          </div>
          <button class="detail-button" onclick="showDetail(${song.id})">コールを見る ♡</button>
        </div>
      `).join("");
    }

        </div>
      `;

      detailContainer.innerHTML = html;
      document.getElementById("home-page").classList.add("hidden");
      document.getElementById("detail-page").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // 初期表示
    document.addEventListener("DOMContentLoaded", showHome);
  </script>
</body>
</html>
