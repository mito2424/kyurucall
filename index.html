      gap: 10px;

      margin-top: 20px;
    }

      border: 1px solid #e9a8c9;

      background: white;

      color: #bd4b83;

      font-weight: bold;

    ================================= */

      background: white;

      outline-color: #d66b9e;

      margin-bottom: 20px;
    }

    ================================= */

      display: grid;

      grid-template-columns:

    }


    .song-card {
      background: white;

      border: 1px solid #f0d4e2;

      border-radius: 20px;

      padding: 20px;

      box-shadow:
        0 5px 20px rgba(180, 90, 140, 0.07);

      display: flex;

      flex-direction: column;

      min-height: 430px;
    }


    .song-card h3 {

      color: #bd4b83;

      font-size: 20px;

      text-align: center;
    }


    /* ================================
       サムネイル
    ================================= */

    .song-image {
      width: 100%;

      aspect-ratio: 16 / 9;

      margin: 0 0 18px;

      border-radius: 14px;

      overflow: hidden;

      background: #f8edf4;

      display: flex;

      align-items: center;

      justify-content: center;
    }


    .song-image img {
      width: 100%;

      height: 100%;

      display: block;

      object-fit: contain;
    }

       曲を見るボタン
    ================================= */

    .detail-button {
      border: none;

      border-radius: 999px;

      background: #d8669c;

      color: white;

      font-weight: bold;

      margin-top: auto;

      background: #bd4b83;
    }

       曲別ページ
    ================================= */

      margin-bottom: 20px;
    }

      background:
        linear-gradient(
          135deg,
          #ffe1ee,
          #f3e4ff

      padding: 25px;

      margin-bottom: 22px;

      text-align: center;
    }


    .detail-heading h2 {
      color: #bd4b83;

      margin: 0;

      font-size: 28px;
    }

       セクション
    ================================= */

      border: 1px solid #f1d4e3;

      border-radius: 16px;

      padding: 20px;

      margin-bottom: 20px;

    ================================= */

      gap: 12px;
    }

      font-weight: bold;
      text-align: center;

      padding: 10px;

    .call-th {

      padding: 10px;
      border-radius: 8px;
    }

    .table-row {
      display: grid;

      border-bottom: 1px dashed #f0d4e2;
      padding-bottom: 10px;

    ================================= */

    /* ========================================
       YouTube ID抽出関数
    ======================================== */

    function extractYouTubeId(urlOrId) {
      if (!urlOrId) return "";
      const match = urlOrId.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      return match ? match[1] : urlOrId.trim();
    }


    /* ========================================
       HTML安全表示
    ======================================== */

    function escapeHTML(text) {

      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /* ========================================
       曲一覧表示
    ======================================== */

    function renderSongs(list = songs) {

      const songList =
        document.getElementById("song-list");

      songList.innerHTML = "";

      if (list.length === 0) {

        songList.innerHTML = `
          <div class="empty">
            該当する曲が見つかりませんでした。
          </div>
        `;

        return;
      }


      list.forEach(song => {

        const card =
          document.createElement("article");

        card.className = "song-card";


        card.innerHTML = `

          <h3>
            ${escapeHTML(song.title)}
          </h3>

          <div class="song-image">

            <img
              src="${escapeHTML(song.image)}"
              alt="${escapeHTML(song.title)}"
            >

          </div>

          <button class="detail-button">
            歌詞・コールを見る
          </button>

        `;


        card
          .querySelector(".detail-button")
          .addEventListener(
            "click",
            () => showSong(song.id)
          );


        songList.appendChild(card);

      });

    }


    /* ========================================
       曲検索
    ======================================== */

    function searchSongs() {

      const keyword =
        document
          .getElementById("search")
          .value
          .trim()
          .toLowerCase();


      const filtered =
        songs.filter(song =>
          song.title
            .toLowerCase()
            .includes(keyword)
        );


      renderSongs(filtered);

    }


    /* ========================================
       ホーム表示
    ======================================== */

    function showHome() {

      document
        .getElementById("home-page")
        .classList
        .remove("hidden");


      document
        .getElementById("detail-page")
        .classList
        .add("hidden");


      window.scrollTo(0, 0);

    }


    /* ========================================
       曲詳細表示（lyricsCalls対応）
    ======================================== */

    function showSong(id) {
      const song = songs.find(item => item.id === id);
      if (!song) return;

      document.getElementById("home-page").classList.add("hidden");
      document.getElementById("detail-page").classList.remove("hidden");

      /* YouTube */
      let videoHTML = "";
      const videoId = extractYouTubeId(song.youtubeId);

      if (videoId) {
        // startTimeが設定されていれば ?start=秒数 を追加
        const startParam = song.startTime ? `?start=${song.startTime}` : "";
        const videoSrc = `https://www.youtube.com/embed/${videoId}${startParam}`;

        videoHTML = `
          <div class="video-wrapper">
            <iframe src="${videoSrc}" loading="lazy" allowfullscreen></iframe>
          </div>
        `;
      } else {
        videoHTML = `<div class="notice">まだ参考動画が設定されていません。</div>`;
      }

      /* 歌詞・コールの行ごと出力 */
      let rowsHTML = "";
      if (song.lyricsCalls && song.lyricsCalls.length > 0) {
        rowsHTML = song.lyricsCalls.map(block => `
          <div class="table-row">
            <div class="lyrics-td">${escapeHTML(block.lyrics || "")}</div>
            <div class="call-td">${escapeHTML(block.call || "")}</div>
          </div>
        `).join("");
      } else {
        rowsHTML = `
          <div class="table-row">
            <div class="lyrics-td">${escapeHTML(song.lyrics || "")}</div>
            <div class="call-td">${escapeHTML(song.calls || "")}</div>
          </div>
        `;
      }

      /* 描画 */
      document.getElementById("song-detail").innerHTML = `
        <div class="detail-heading">
          <h2>${escapeHTML(song.title)}</h2>
        </div>

        <div class="section">
          <div class="lyrics-call-table">
            <div class="table-header">
              <div class="lyrics-th">歌詞</div>
              <div class="call-th">📣 コール・掛け声</div>
            </div>
            ${rowsHTML}
          </div>
        </div>

        <div class="section">
          <h3>▶ 参考動画</h3>
          ${videoHTML}
        </div>
      `;

      window.scrollTo(0, 0);
    }


    /* ========================================
       初期表示
    ======================================== */

    renderSongs();

  </script>
