    }

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      padding: 45px 20px 50px;

      text-align: center;

      border-bottom: 1px solid #efc4da;
    }


    .logo {
      margin: 0;

      font-size: 30px;

      color: white;

      text-shadow:
        -2px -2px 0 #c64e88,

        -2px  2px 0 #c64e88,
         2px  2px 0 #c64e88,

    }


    .subtitle {
      color: white;

      font-size: 12px;

      letter-spacing: 2px;

      margin: 4px 0 14px;

      text-shadow:
        -1px -1px 0 #a75b80,
         1px -1px 0 #a75b80,
        -1px  1px 0 #a75b80,
         1px  1px 0 #a75b80;
    }


    .intro {
      max-width: 680px;

      margin: 0 auto;

      font-size: 14px;

      color: white;

      text-shadow:
        -1px -1px 0 #a75b80,
         1px -1px 0 #a75b80,
        -1px  1px 0 #a75b80,
         1px  1px 0 #a75b80;
    }


    .nav {
      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 10px;

      margin-top: 20px;
    }


    .nav button,
    .back-button {
      border: 1px solid #e9a8c9;

      background: white;

      color: #bd4b83;

      border-radius: 999px;

      padding: 8px 18px;

      font-weight: bold;
    }


    /* ================================
       全体
    ================================= */

    .container {
      max-width: 1050px;

      margin: 0 auto;

      padding: 30px 16px 60px;
    }


    /* ================================
       検索
    ================================= */

    .search-box {
      display: block;

      width: 100%;

      padding: 13px 16px;

      border: 1px solid #efc3da;

      border-radius: 12px;

      background: white;

      outline-color: #d66b9e;

      margin-bottom: 20px;
    }


    /* ================================
       曲一覧
    ================================= */

    .song-grid {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 18px;
    }


    .song-card {
      background: white;

      border: 1px solid #f0d4e2;

      border-radius: 20px;

      padding: 20px;

      box-shadow:
        0 5px 20px rgba(180, 90, 140, 0.07);

      display: flex;

      flex-direction: column;

      min-height: 430px;
    }


    .song-card h3 {
      margin: 0 0 12px;

      color: #bd4b83;

      font-size: 20px;

      text-align: center;
    }


    /* ================================
       サムネイル
    ================================= */

    .song-image {
      width: 100%;

      aspect-ratio: 16 / 9;

      margin: 0 0 18px;

      border-radius: 14px;

      overflow: hidden;

      background: #f8edf4;

      display: flex;

      align-items: center;

      justify-content: center;
    }


    .song-image img {
      width: 100%;

      height: 100%;

      display: block;

      object-fit: contain;
    }


    /* ================================
       曲を見るボタン
    ================================= */

    .detail-button {
      border: none;

      border-radius: 999px;

      padding: 10px 16px;

      background: #d8669c;

      color: white;

      font-weight: bold;

      margin-top: auto;
    }


    .detail-button:hover {
      background: #bd4b83;
    }


    /* ================================
       曲別ページ
    ================================= */

    .back-button {
      margin-bottom: 20px;
    }


    .detail-heading {
      background:
        linear-gradient(
          135deg,
          #ffe1ee,
          #f3e4ff
        );

      border-radius: 18px;

      padding: 25px;

      margin-bottom: 22px;

      text-align: center;
    }


    .detail-heading h2 {
      color: #bd4b83;

      margin: 0;

      font-size: 28px;
    }


    /* ================================
       セクション
    ================================= */

    .section {
      background: white;

      border: 1px solid #f1d4e3;

      border-radius: 16px;

      padding: 20px;

      margin-bottom: 20px;
    }


    .section h3 {
      margin-top: 0;

      color: #bd4b83;

      font-size: 20px;

      border-bottom:
        2px solid #f8d9e8;

      padding-bottom: 8px;
    }

       歌詞・コール（ブロック表示）
    ================================= */

    .lyrics-call-table {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .table-header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 8px;
    }

    .lyrics-th {
      background: #f8e6f0;
      color: #bd4b83;
      padding: 10px;
      border-radius: 8px;
    }

    .call-th {
      background: #f3e8fb;
      color: #9555a8;
      padding: 10px;
      border-radius: 8px;
    }

    .table-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      border-bottom: 1px dashed #f0d4e2;
      padding-bottom: 10px;
    }

    .lyrics-td, .call-td {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.8;
    }

    .lyrics-td { color: #4b3946; }
    .call-td { color: #b13e76; font-weight: 700; }

       YouTube
    ================================= */

    .video-wrapper {
      position: relative;

      width: 100%;

      padding-top: 56.25%;

      overflow: hidden;

      border-radius: 12px;

      background: #f8e9f1;
    }


    .video-wrapper iframe {
      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      border: 0;
    }


    .notice {
      font-size: 12px;

      color: #947687;

      background: #fff8fc;

      padding: 12px;

      border-radius: 8px;

      margin-top: 12px;

      overflow-wrap: anywhere;
    }

       曲がない場合
    ================================= */

      grid-column: 1 / -1;

      text-align: center;

      padding: 30px;

      background: white;

      border-radius: 14px;

       フッター
    ================================= */

      color: #977287;

    ================================= */

    function renderSongs(list) {
      const songList = document.getElementById("song-list");
      if (list.length === 0) {
        songList.innerHTML = `<div class="empty">該当する曲が見つかりません</div>`;
        return;
      }
      songList.innerHTML = list.map(song => `
        <div class="song-card">
          <h3>${song.title}</h3>
          <div class="song-image">
            <img src="${song.image}" alt="${song.title}" onerror="this.style.display='none'">
          </div>
          <button class="detail-button" onclick="showDetail(${song.id})">曲を見る</button>
        </div>
      `).join("");
    }

    function searchSongs() {
      const query = document.getElementById("search").value.toLowerCase();
      const filtered = songs.filter(song => song.title.toLowerCase().includes(query));
      renderSongs(filtered);
    }

    function showHome() {
      document.getElementById("home-page").classList.remove("hidden");
      document.getElementById("detail-page").classList.add("hidden");
      renderSongs(songs);
    }

    function getYoutubeId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : url;
    }

    function showDetail(id) {
      const song = songs.find(s => s.id === id);
      if (!song) return;

      const ytId = getYoutubeId(song.youtubeId);
      const embedUrl = `https://www.youtube.com/embed/${ytId}?start=${song.startTime || 0}`;

      const rows = song.lyricsCalls.map(item => `
        <div class="table-row">
          <div class="lyrics-td">${item.lyrics}</div>
          <div class="call-td">${item.call}</div>
        </div>
      `).join("");

      document.getElementById("song-detail").innerHTML = `
        <div class="detail-heading">
          <h2>${song.title}</h2>
        </div>
        <div class="section">
          <h3>歌詞・コール</h3>
          <div class="lyrics-call-table">
            <div class="table-header">
              <div class="lyrics-th">歌詞</div>
              <div class="call-th">コール</div>
            </div>
            ${rows}
          </div>
        </div>
        <div class="section">
          <h3>参考動画</h3>
          <div class="video-wrapper">
            <iframe src="${embedUrl}" allowfullscreen></iframe>
          </div>
        </div>
      `;

      document.getElementById("home-page").classList.add("hidden");
      document.getElementById("detail-page").classList.remove("hidden");
      window.scrollTo(0, 0);
    }

    
    /* ========================================== YouTube ID抽出関数 ========================================== */
    function extractYouTubeId(urlOrId) {
      if (!urlOrId) return "";
      const match = urlOrId.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      return match ? match[1] : urlOrId.trim();
    }

    /* ========================================== HTML安全表示 ========================================== */
    function escapeHTML(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    /* ========================================== 曲一覧表示 ========================================== */
    function renderSongs(list = songs) {
      const songList = document.getElementById("song-list");
      songList.innerHTML = "";
      if (list.length === 0) {
        songList.innerHTML = `<div class="empty">該当する曲が見つかりませんでした。</div>`;
        return;
      }
      list.forEach(song => {
        const card = document.createElement("article");
        card.className = "song-card";
        card.onclick = () => showDetail(song.id);
        card.innerHTML = `
          <h3>${escapeHTML(song.title)}</h3>
          <div class="song-image">
            <img src="${escapeHTML(song.image)}" alt="${escapeHTML(song.title)}" onerror="this.style.display='none'">
          </div>
          <button class="detail-button">曲を見る</button>
        `;
        songList.appendChild(card);
      });
    }

    /* ========================================== 検索機能 ========================================== */
    function searchSongs() {
      const query = document.getElementById("search").value.toLowerCase().trim();
      const filtered = songs.filter(song => song.title.toLowerCase().includes(query));
      renderSongs(filtered);
    }

    /* ========================================== ホーム画面表示 ========================================== */
    function showHome() {
      document.getElementById("home-page").classList.remove("hidden");
      document.getElementById("detail-page").classList.add("hidden");
      renderSongs(songs);
    }

    /* ========================================== 詳細画面表示 ========================================== */
    function showDetail(id) {
      const song = songs.find(s => s.id === id);
      if (!song) return;

      const ytId = extractYouTubeId(song.youtubeId);
      const videoHTML = ytId 
        ? `<iframe src="https://www.youtube.com/embed/${ytId}?start=${song.startTime || 0}" allowfullscreen></iframe>`
        : `<p>まだ参考動画が設定されていません。</p>`;

      let rowsHTML = "";
      if (song.lyricsCalls && song.lyricsCalls.length > 0) {
        rowsHTML = song.lyricsCalls.map(block => `
          <div class="table-row">
            <div class="lyrics-td">${escapeHTML(block.lyrics || "")}</div>
            <div class="call-td">${escapeHTML(block.call || "")}</div>
          </div>
        `).join("");
      }

      document.getElementById("song-detail").innerHTML = `
        <div class="detail-heading">
          <h2>${escapeHTML(song.title)}</h2>
        </div>
        <div class="section">
          <h3>歌詞・コール</h3>
          <div class="lyrics-call-table">
            <div class="table-header">
              <div class="lyrics-th">歌詞</div>
              <div class="call-th">コール・掛け声</div>
            </div>
            ${rowsHTML}
          </div>
        </div>
        <div class="section">
          <h3>参考動画</h3>
          <div class="video-wrapper">
            ${videoHTML}
          </div>
        </div>
      `;

      document.getElementById("home-page").classList.add("hidden");
      document.getElementById("detail-page").classList.remove("hidden");
      window.scrollTo(0, 0);
    }

    /* ========================================== 初期表示 ========================================== */
    renderSongs();
